  nameField.appendChild(nameInput);
  wrap.appendChild(nameField);

  // Starter slots
  const slotsField = el('div','modal-field');
  slotsField.appendChild(el('label',null,'Starter Roster Slots'));
  const presetRow = el('div','slot-presets');
  SLOT_PRESETS.forEach(preset => {
    const btn = el('button','preset-btn', '+ ' + preset.label);
    btn.onclick = () => addFormSlot(preset);
    presetRow.appendChild(btn);
  });
  const blankBtn = el('button','preset-btn','+ Custom slot');
  blankBtn.onclick = () => addFormSlot({label:'', eligible:[]});
  presetRow.appendChild(blankBtn);
  slotsField.appendChild(presetRow);

  const slotList = el('div','slot-list');
  if(f.slots.length === 0){
    slotList.appendChild(el('div','slot-empty-hint','No slots yet — add some above (e.g. QB, RB, FLEX).'));
  }
  f.slots.forEach(s => {
    const row = el('div','slot-form-row');
    const labelInput = el('input','slot-label-input');
    labelInput.type = 'text';
    labelInput.value = s.label;
    labelInput.placeholder = 'Label';
    labelInput.oninput = (e) => { s.label = e.target.value; };
    row.appendChild(labelInput);

    const posBoxes = el('div','slot-pos-boxes');
    ['QB','RB','WR','TE','DST','K'].forEach(pos => {
      const box = el('label','pos-checkbox'+(s.eligible.includes(pos)?' checked':''));
      box.innerHTML = `<input type="checkbox" ${s.eligible.includes(pos)?'checked':''}/> ${pos}`;
      box.querySelector('input').onchange = () => toggleFormSlotPos(s.tempId, pos);
      posBoxes.appendChild(box);
    });
    row.appendChild(posBoxes);

    const removeBtn = el('button','slot-remove-btn','&times;');
    removeBtn.onclick = () => removeFormSlot(s.tempId);
    row.appendChild(removeBtn);

    slotList.appendChild(row);
  });
  slotsField.appendChild(slotList);
  wrap.appendChild(slotsField);

  // Bench size
  const benchField = el('div','modal-field');
  benchField.appendChild(el('label',null,'Bench Size'));
  const benchInput = el('input','api-key-input');
  benchInput.type = 'number';
  benchInput.min = '0';
  benchInput.value = f.benchCount;
  benchInput.oninput = (e) => { f.benchCount = e.target.value === '' ? 0 : Number(e.target.value); };
  benchField.appendChild(benchInput);
  wrap.appendChild(benchField);

  // Position caps
  const capsField = el('div','modal-field');
  capsField.appendChild(el('label',null,'Position Caps (optional — stop suggesting more of a position once you\'ve drafted this many)'));
  const capsRow = el('div','caps-row');
  ['QB','RB','WR','TE','DST','K'].forEach(pos => {
    const capBox = el('div','cap-box');
    capBox.appendChild(el('span','cap-pos-label', pos));
    const capInput = el('input','cap-input');
    capInput.type = 'number';
    capInput.min = '0';
    capInput.placeholder = '—';
    capInput.value = f.caps[pos] !== undefined ? f.caps[pos] : '';
    capInput.oninput = (e) => { f.caps[pos] = e.target.value; };
    capBox.appendChild(capInput);
    capsRow.appendChild(capBox);
  });
  capsField.appendChild(capsRow);
  wrap.appendChild(capsField);

  // Scoring premium
  const premiumField = el('div','modal-field');
  const premiumCheckLabel = el('label','premium-enable-toggle');
  premiumCheckLabel.innerHTML = `<input type="checkbox" ${f.premiumEnabled?'checked':''}/> This league's scoring notably boosts one position's value`;
  premiumCheckLabel.querySelector('input').onchange = (e) => { f.premiumEnabled = e.target.checked; render(); };
  premiumField.appendChild(premiumCheckLabel);
  if(f.premiumEnabled){
    const premiumSub = el('div','premium-sub-fields');
    const posSelect = document.createElement('select');
    posSelect.className = 'premium-pos-select';
    ['QB','RB','WR','TE','DST','K'].forEach(pos => {
      const opt = document.createElement('option');
      opt.value = pos; opt.textContent = pos;
      if(f.premiumType === pos) opt.selected = true;
      posSelect.appendChild(opt);
    });
    posSelect.onchange = (e) => { f.premiumType = e.target.value; };
    premiumSub.appendChild(posSelect);

    const bonusInput = el('input','api-key-input');
    bonusInput.type = 'number';
    bonusInput.placeholder = 'Bonus points (e.g. 60)';
    bonusInput.value = f.premiumBonus;
    bonusInput.oninput = (e) => { f.premiumBonus = e.target.value; };
    premiumSub.appendChild(bonusInput);

    const labelInput2 = el('input','api-key-input');
    labelInput2.type = 'text';
    labelInput2.placeholder = 'Label shown on the toggle (e.g. "QB premium (6pt passing TDs)")';
    labelInput2.value = f.premiumLabel;
    labelInput2.oninput = (e) => { f.premiumLabel = e.target.value; };
    premiumSub.appendChild(labelInput2);

    const defaultLabel = el('label','premium-enable-toggle');
    defaultLabel.innerHTML = `<input type="checkbox" ${f.premiumDefault?'checked':''}/> On by default`;
    defaultLabel.querySelector('input').onchange = (e) => { f.premiumDefault = e.target.checked; };
    premiumSub.appendChild(defaultLabel);

    premiumField.appendChild(premiumSub);

  wrap.appendChild(premiumField);

  // Scoring reference notes
  const notesField = el('div','modal-field');
  notesField.appendChild(el('label',null,'Scoring Reference Notes (optional, shown for your own reference)'));

    row.appendChild(valueInput);

    removeNoteBtn.onclick = () => removeFormNote(idx);
    row.appendChild(removeNoteBtn);
    notesField.appendChild(row);
  });
  const addNoteBtn = el('button','preset-btn','+ Add note');
  addNoteBtn.onclick = () => addFormNote();
  notesField.appendChild(addNoteBtn);
  wrap.appendChild(notesField);

  if(f.error){
    wrap.appendChild(el('div','form-error', f.error));
  }

  return wrap;
}

  actions.appendChild(saveBtn);
  if(state.tags[state.tagModal.id]){
    const removeBtn = el('button','btn btn-remove','Remove');
    removeBtn.onclick = () => removeTag(state.tagModal.id);
    actions.appendChild(removeBtn);
  }
  const cancelBtn = el('button','btn btn-cancel','Cancel');
  cancelBtn.onclick = () => closeTagModal();
  actions.appendChild(cancelBtn);
  card.appendChild(actions);

  overlay.appendChild(card);
  container.appendChild(overlay);
}

document.getElementById('csv-input').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(file) handleCSVUpload(file, uploadTargetPool);
  e.target.value = '';
});

document.getElementById('backup-input').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(file) handleBackupUpload(file);
  e.target.value = '';
});

async function initApp(){
  if(!window.storage){ render(); return; }

  try{
    const listRes = await window.storage.get('leagues-list', false);
    if(listRes && listRes.value){
      leagues = JSON.parse(listRes.value);
    }
  } catch(err){ /* no leagues saved yet — first-ever launch */ }

  if(Object.keys(leagues).length === 0){
    activeLeagueId = null;
    render();
    return;
  }

  try{
    const idRes = await window.storage.get('active-league-id', false);
    if(idRes && idRes.value && leagues[idRes.value]){
      activeLeagueId = idRes.value;
    }
  } catch(err){ /* no saved preference — fall through to picking one below */ }

  if(!activeLeagueId || !leagues[activeLeagueId]){
    activeLeagueId = Object.keys(leagues)[0]; // fall back to whichever league exists
  }

  STARTER_SLOTS = leagues[activeLeagueId].starterSlots;
  BENCH_COUNT = leagues[activeLeagueId].benchCount;
  premiumOn = leagues[activeLeagueId].premiumDefault;

  loadSavedSession();
}

initApp();
</script>
</body>
</html>
