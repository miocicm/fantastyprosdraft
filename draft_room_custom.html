<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Draft Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0E12;
    --panel:#121821;
    --panel-2:#161D28;
    --line:#232B38;
    --text:#EDEFF2;
    --text-dim:#8A93A3;
    --text-faint:#5A6272;
    --gold:#E8B04B;
    --gold-dim:#5C4A26;
    --qb:#E63976;
    --rb:#2DD4A6;
    --wr:#4C8DFF;
    --te:#F5A623;
    --dst:#9B8CFF;
    --k:#7C8798;
    --good:#37C97A;
    --danger:#E5484D;
    --note-yellow:#F0D63C;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--gold-dim); color:var(--gold);}

  .eyebrow{
    font-family:'Roboto Mono',monospace;
    font-size:20px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--danger);
    font-weight:700;
  }
  .display{
    font-family:'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:0.01em;
  }

  #app{
    max-width:1400px;
    margin:0 auto;
    padding:20px 20px 60px;
  }

  /* HEADER */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding-bottom:18px;
    margin-bottom:14px;
    border-bottom:1px solid var(--line);
    flex-wrap:wrap;
  }
  .brand{display:flex; flex-direction:column; gap:2px;}
  .brand-row{display:flex; align-items:baseline; gap:10px;}
  .brand h1{
    font-family:'Oswald',sans-serif;
    font-size:22px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.03em;
  }
  .source-block{
    display:flex;
    flex-direction:column;
    gap:2px;
    margin-top:2px;
  }
  .source-line{
    font-family:'Roboto Mono',monospace;
    font-size:10px;
    color:var(--text-faint);
  }
  .source-line strong{
    color:var(--text-faint);
    font-weight:600;
  }
  .source-line.active-source{
    color:var(--gold);
  }
  .source-line.active-source strong{
    color:var(--gold);
  }
  .source-line.no-csv-alert{
    color:var(--danger);
    text-decoration:underline;
    font-weight:700;
    font-size:11px;
  }
  .header-right{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  }
  .pick-tracker{
    display:flex;
    align-items:center;
    gap:14px;
    font-family:'Roboto Mono',monospace;
  }
  .pick-tracker .num{
    font-size:26px;
    font-weight:600;
    color:var(--gold);
    line-height:1;
  }
  .pick-tracker .lbl{
    font-size:10px;
    color:var(--text-faint);
    text-transform:uppercase;
    letter-spacing:0.1em;
  }
  .pick-stepper{display:flex; gap:6px;}
  .pick-stepper button{
    width:26px; height:26px;
    border-radius:5px;
    border:1px solid var(--line);
    background:var(--panel-2);
    color:var(--text-dim);
    cursor:pointer;
    font-size:14px;
    display:flex; align-items:center; justify-content:center;
  }
  .pick-stepper button:hover{border-color:var(--gold); color:var(--gold);}
  .save-indicator{
    font-family:'Roboto Mono',monospace;
    font-size:10px;
    letter-spacing:0.03em;
    padding:5px 9px;
    border-radius:6px;
    border:1px solid var(--line);
    white-space:nowrap;
  }
  .save-indicator.ok{color:var(--good); border-color:rgba(55,201,122,0.3);}
  .save-indicator.saving{color:var(--text-faint);}
  .save-indicator.failed{color:var(--danger); border-color:rgba(229,72,77,0.4); background:rgba(229,72,77,0.06);}

  .upload-btn, .reset-btn{
    font-family:'Roboto Mono',monospace;
    font-size:11px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    background:transparent;
    border:1px solid var(--line);
    color:var(--text-faint);
    padding:7px 12px;
    border-radius:6px;
    cursor:pointer;
  }
  .upload-btn{border-color:var(--gold-dim); color:var(--gold);}
  .upload-btn:hover{background:rgba(232,176,75,0.1);}
  .reset-btn:hover{border-color:var(--danger); color:var(--danger);}

  .status-banner{
    display:none;
    align-items:center;
    gap:10px;
    padding:9px 14px;
    border-radius:8px;
    font-family:'Roboto Mono',monospace;
    font-size:12px;
    margin-bottom:14px;
    border:1px solid;
  }
  .status-banner.show{display:flex;}
  .status-banner.ok{background:rgba(55,201,122,0.08); border-color:rgba(55,201,122,0.3); color:var(--good);}
  .status-banner.err{background:rgba(229,72,77,0.08); border-color:rgba(229,72,77,0.3); color:var(--danger);}
  .status-banner button{
    margin-left:auto;
    background:none; border:none; color:inherit; cursor:pointer; font-size:13px;
  }

  /* LAYOUT */
  .layout{
    display:grid;
    grid-template-columns:340px 1fr;
    gap:20px;
    align-items:start;
  }
  @media (max-width:900px){
    .layout{grid-template-columns:1fr;}
  }

  /* LEFT COLUMN */
  .col-left{
    position:sticky;
    top:20px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  @media (max-width:900px){ .col-left{position:static;} }

  /* ON THE CLOCK CARD */
  .clock-card{
    background:linear-gradient(155deg, var(--panel-2) 0%, var(--panel) 70%);
    border:1px solid var(--gold-dim);
    border-radius:12px;
    padding:18px;
    position:relative;
    overflow:hidden;
  }
  .clock-card::before{
    content:'';
    position:absolute; top:0; left:0; right:0; height:2px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .clock-header{
    display:flex; align-items:center; gap:8px;
    margin-bottom:14px;
  }
  .clock-header-spacer{flex:1;}
  .hide-toggle-btn{
    background:none;
    border:1px solid var(--line);
    color:var(--text-faint);
    font-family:'Roboto Mono',monospace;
    font-size:10px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    padding:5px 9px;
    border-radius:6px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:5px;
  }
  .hide-toggle-btn:hover{border-color:var(--gold); color:var(--gold);}
  .rec-hidden{
    padding:22px 4px 10px;
    text-align:center;
  }
  .rec-hidden .eye-icon{
    font-size:22px;
    margin-bottom:8px;
    opacity:0.5;
  }
  .rec-hidden .hidden-txt{
    font-size:13px;
    color:var(--text-faint);
    margin-bottom:14px;
  }
  .rec-hidden .btn{width:100%;}

  /* BADGES: tags + news */
  .badge-row{
    display:inline-flex;
    align-items:center;
    gap:5px;
    margin-left:6px;
    vertical-align:middle;
  }
  .tag-badge{
    width:17px; height:17px;
    border-radius:50%;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-size:9px;
    font-weight:800;
    color:#0A0E12;
    cursor:pointer;
    border:none;
    flex-shrink:0;
  }
  .icon-btn{
    width:17px; height:17px;
    border-radius:50%;
    border:1px dashed var(--line);
    background:none;
    color:var(--text-faint);
    font-size:10px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    line-height:1;
    padding:0;
    flex-shrink:0;
  }
  .icon-btn:hover{border-color:var(--gold); color:var(--gold);}
  .news-badge{
    width:17px; height:17px;
    border-radius:50%;
    border:1px solid var(--line);
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-size:9px;
    font-weight:800;
    cursor:pointer;
    background:var(--panel-2);
    flex-shrink:0;
  }
  .news-badge.loading{
    color:var(--text-faint);
    cursor:default;
    font-size:8px;
    letter-spacing:1px;
  }
  .news-line{
    font-size:11px;
    line-height:1.35;
    margin-top:3px;
    max-width:100%;
  }

  /* MODAL */
  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(6,8,11,0.7);
    display:flex; align-items:center; justify-content:center;
    z-index:100;
    padding:20px;
  }
  .modal-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:20px;
    width:360px;
    max-width:100%;
  }
  .modal-card h3{
    font-family:'Oswald',sans-serif;
    font-size:16px;
    text-transform:uppercase;
    letter-spacing:0.02em;
    margin-bottom:16px;
  }
  .modal-field{margin-bottom:14px;}
  .modal-field label{
    display:block;
    font-size:10px;
    color:var(--text-faint);
    margin-bottom:7px;
    font-family:'Roboto Mono',monospace;
    text-transform:uppercase;
    letter-spacing:0.06em;
  }
  .type-options{display:flex; gap:8px;}
  .type-option{
    flex:1;
    padding:10px 8px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--panel-2);
    text-align:center;
    cursor:pointer;
    font-size:12px;
    color:var(--text-dim);
    font-weight:600;
  }
  .type-option.active{
    border-color:var(--gold);
    color:var(--gold);
    background:rgba(232,176,75,0.08);
  }
  .modal-textarea{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:7px;
    padding:10px;
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:13px;
    resize:vertical;
    min-height:70px;
  }
  .modal-textarea:focus{outline:none; border-color:var(--gold);}
  .modal-actions{display:flex; gap:8px; margin-top:2px;}
  .modal-actions .btn{flex:1;}
  .btn-remove{background:transparent; border:1px solid var(--danger); color:var(--danger);}
  .btn-remove:hover{background:rgba(229,72,77,0.1);}
  .btn-cancel{background:transparent; border:1px solid var(--line); color:var(--text-dim);}
  .btn-cancel:hover{border-color:var(--text-dim); color:var(--text);}

  /* LEAGUE SETUP FORM (setup screen + modal share these) */
  .setup-screen{
    min-height:80vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .setup-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:28px;
    width:100%;
    max-width:560px;
  }
  .setup-title{
    font-family:'Oswald',sans-serif;
    font-size:24px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.02em;
    margin-bottom:8px;
  }
  .setup-sub{
    font-size:13px;
    color:var(--text-dim);
    line-height:1.5;
    margin-bottom:24px;
  }
  .league-form-card{
    width:560px;
    max-height:85vh;
    overflow-y:auto;
  }
  .league-form-fields .modal-field{margin-bottom:18px;}
  .slot-presets{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;}
  .preset-btn{
    font-family:'Roboto Mono',monospace;
    font-size:11px;
    font-weight:600;
    padding:6px 10px;
    border-radius:16px;
    border:1px solid var(--gold-dim);
    background:var(--panel-2);
    color:var(--gold);
    cursor:pointer;
  }
  .preset-btn:hover{background:rgba(232,176,75,0.1);}
  .slot-list{display:flex; flex-direction:column; gap:8px;}
  .slot-empty-hint{
    font-size:12px;
    color:var(--text-faint);
    font-style:italic;
    padding:8px 0;
  }
  .slot-form-row{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px;
    background:var(--panel-2);
    border-radius:8px;
    border:1px solid var(--line);
  }
  .slot-label-input{
    width:90px;
    flex-shrink:0;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    padding:6px 8px;
    color:var(--text);
    font-size:12px;
    font-family:'Roboto Mono',monospace;
  }
  .slot-label-input:focus{outline:none; border-color:var(--gold);}
  .slot-pos-boxes{display:flex; flex-wrap:wrap; gap:8px; flex:1;}
  .pos-checkbox{
    display:flex; align-items:center; gap:4px;
    font-size:11px;
    color:var(--text-faint);
    cursor:pointer;
    font-family:'Roboto Mono',monospace;
  }
  .pos-checkbox.checked{color:var(--text);}
  .pos-checkbox input{accent-color:var(--gold);}
  .slot-remove-btn{
    width:22px; height:22px;
    border-radius:50%;
    border:1px solid var(--line);
    background:none;
    color:var(--text-faint);
    cursor:pointer;
    flex-shrink:0;
    font-size:14px;
    line-height:1;
  }
  .slot-remove-btn:hover{border-color:var(--danger); color:var(--danger);}
  .caps-row{display:flex; flex-wrap:wrap; gap:10px;}
  .cap-box{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    width:56px;
  }
  .cap-pos-label{
    font-size:10px;
    font-family:'Roboto Mono',monospace;
    color:var(--text-faint);
  }
  .cap-input{
    width:100%;
    text-align:center;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:6px;
    padding:6px 4px;
    color:var(--text);
    font-size:12px;
    font-family:'Roboto Mono',monospace;
  }
  .cap-input:focus{outline:none; border-color:var(--gold);}
  .cap-summary{
    font-size:11px;
    color:var(--text-faint);
    font-family:'Roboto Mono',monospace;
    margin-bottom:12px;
  }
  .premium-enable-toggle{
    display:flex; align-items:center; gap:8px;
    font-size:13px;
    color:var(--text);
    cursor:pointer;
    margin-bottom:10px;
  }
  .premium-enable-toggle input{accent-color:var(--gold);}
  .premium-sub-fields{
    display:flex;
    flex-direction:column;
    gap:8px;
    padding:12px;
    background:var(--panel-2);
    border-radius:8px;
    border:1px solid var(--line);
  }
  .premium-pos-select{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    padding:8px 10px;
    color:var(--text);
    font-size:12px;
    font-family:'Roboto Mono',monospace;
  }
  .note-form-row{
    display:flex;
    gap:8px;
    margin-bottom:8px;
  }
  .note-label-input, .note-value-input{
    flex:1;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:6px;
    padding:7px 9px;
    color:var(--text);
    font-size:12px;
    font-family:'Inter',sans-serif;
  }
  .note-label-input:focus, .note-value-input:focus{outline:none; border-color:var(--gold);}
  .form-error{
    font-size:12px;
    color:var(--danger);
    background:rgba(229,72,77,0.08);
    border:1px solid rgba(229,72,77,0.3);
    border-radius:7px;
    padding:9px 12px;
    margin-top:6px;
  }
  .league-manage-row{
    display:flex;
    gap:6px;
    margin-bottom:12px;
    flex-wrap:wrap;
  }
  .manage-btn{
    font-family:'Roboto Mono',monospace;
    font-size:10.5px;
    font-weight:600;
    padding:6px 10px;
    border-radius:6px;
    border:1px solid var(--line);
    background:var(--panel-2);
    color:var(--text-dim);
    cursor:pointer;
  }
  .manage-btn:hover{border-color:var(--gold); color:var(--gold);}
  .manage-btn.danger:hover{border-color:var(--danger); color:var(--danger);}

  .pulse-dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--gold);
    box-shadow:0 0 0 0 rgba(232,176,75,0.5);
    animation:pulse 2s infinite;
  }
  @media (prefers-reduced-motion: reduce){ .pulse-dot{animation:none;} }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(232,176,75,0.45);}
    70%{box-shadow:0 0 0 8px rgba(232,176,75,0);}
    100%{box-shadow:0 0 0 0 rgba(232,176,75,0);}
  }
  .clock-header span{
    font-family:'Roboto Mono',monospace;
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:600;
  }
  .rec-name{
    font-family:'Oswald',sans-serif;
    font-size:28px;
    font-weight:700;
    text-transform:uppercase;
    line-height:1.05;
    margin-bottom:6px;
  }
  .rec-meta{
    display:flex; align-items:center; gap:8px;
    margin-bottom:12px;
    flex-wrap:wrap;
  }
  .pos-tag{
    font-family:'Roboto Mono',monospace;
    font-size:11px;
    font-weight:700;
    padding:2px 7px;
    border-radius:4px;
    color:#0A0E12;
    letter-spacing:0.02em;
  }
  .team-tag{
    font-size:12px;
    color:var(--text-dim);
    font-weight:500;
  }
  .tier-tag{
    font-family:'Roboto Mono',monospace;
    font-size:11px;
    color:var(--text-faint);
  }
  .rec-reason{
    font-size:13px;
    color:var(--text-dim);
    line-height:1.5;
    margin-bottom:16px;
  }
  .rec-actions{display:flex; gap:8px;}
  .btn{
    flex:1;
    padding:10px 12px;
    border-radius:7px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    border:none;
    font-family:'Inter',sans-serif;
    transition:transform 0.08s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-mine{background:var(--gold); color:#211705;}
  .btn-mine:hover{background:#f0bd5f;}
  .btn-taken{background:var(--panel-2); color:var(--text-dim); border:1px solid var(--line);}
  .btn-taken:hover{border-color:var(--text-dim); color:var(--text);}
  .rec-empty{
    font-size:13px; color:var(--text-faint); padding:10px 0;
  }

  /* ROSTER CARD */
  .roster-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px 16px 6px;
  }
  .roster-card h2{
    font-family:'Oswald',sans-serif;
    font-size:14px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    margin-bottom:10px;
    color:var(--text-dim);
  }
  .slot-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 0;
    border-bottom:1px solid var(--line);
  }
  .slot-row:last-child{border-bottom:none;}
  .slot-label{
    font-family:'Roboto Mono',monospace;
    font-size:10px;
    font-weight:700;
    width:52px;
    flex-shrink:0;
    color:var(--text-faint);
    letter-spacing:0.03em;
  }
  .slot-filled .slot-label{color:var(--text-dim);}
  .slot-name{
    font-size:13px;
    font-weight:500;
    color:var(--text-faint);
    flex:1;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .slot-filled .slot-name{color:var(--text);}
  .slot-empty-mark{
    font-size:12px;
    color:var(--text-faint);
    font-style:italic;
  }
  .slot-clear{
    font-size:14px;
    color:var(--text-faint);
    cursor:pointer;
    background:none;
    border:none;
    line-height:1;
    padding:2px 4px;
  }
  .slot-clear:hover{color:var(--danger);}
  .stale-mark{
    font-size:10px; color:var(--danger);
    font-family:'Roboto Mono',monospace;
    margin-left:4px;
  }

  .bench-toggle{
    width:100%;
    background:none;
    border:none;
    color:var(--text-faint);
    font-family:'Roboto Mono',monospace;
    font-size:10px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    padding:10px 0;
    cursor:pointer;
    text-align:left;
  }
  .bench-toggle:hover{color:var(--text-dim);}

  /* LEAGUE CARD */
  .league-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px;
  }
  .league-card h2{
    font-family:'Oswald',sans-serif;
    font-size:14px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--text-dim);
    margin-bottom:2px;
  }
  .league-name{
    font-family:'Roboto Mono',monospace;
    font-size:10px;
    color:var(--gold);
    letter-spacing:0.04em;
    margin-bottom:10px;
  }
  .league-switcher{
    display:flex;
    gap:6px;
    margin-bottom:12px;
  }
  .league-switch-btn{
    flex:1;
    font-family:'Roboto Mono',monospace;
    font-size:10.5px;
    font-weight:600;
    padding:8px 6px;
    border-radius:7px;
    border:1px solid var(--line);
    background:var(--panel-2);
    color:var(--text-faint);
    cursor:pointer;
    letter-spacing:0.01em;
  }
  .league-switch-btn:hover{color:var(--text-dim); border-color:var(--text-dim);}
  .league-switch-btn.active{
    background:var(--gold);
    border-color:var(--gold);
    color:#211705;
  }
  .credit-line{
    font-family:'Roboto Mono',monospace;
    font-size:10px;
    color:var(--danger);
    letter-spacing:0.02em;
    font-weight:600;
    text-align:center;
    margin-bottom:10px;
  }
  .credit-line.trash-talk{
    margin-top:-6px;
    letter-spacing:0.04em;
  }
  .premium-toggle{
    display:flex;
    align-items:center;
    gap:8px;
    padding:9px 10px;
    background:var(--panel-2);
    border:1px solid var(--gold-dim);
    border-radius:7px;
    margin-bottom:12px;
    cursor:pointer;
  }
  .premium-toggle input{accent-color:var(--gold);}
  .premium-toggle .ptxt{font-size:12px; color:var(--text);}
  .premium-toggle .psub{font-size:10px; color:var(--text-faint); font-family:'Roboto Mono',monospace;}
  .scoring-toggle{
    width:100%;
    background:none; border:none;
    color:var(--text-faint);
    font-family:'Roboto Mono',monospace;
    font-size:10px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    padding:2px 0 8px;
    cursor:pointer;
    text-align:left;
  }
  .scoring-toggle:hover{color:var(--text-dim);}
  .scoring-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:6px 0;
    border-bottom:1px solid var(--line);
    font-size:11.5px;
  }
  .scoring-row:last-child{border-bottom:none;}
  .scoring-row .slabel{color:var(--text-dim); flex-shrink:0; width:40%;}
  .scoring-row .sval{color:var(--text-faint); text-align:right;}

  /* FILTER BAR */
  .filter-bar{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:14px;
    flex-wrap:wrap;
  }
  .search-box{
    flex:1;
    min-width:160px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:7px;
    padding:9px 12px;
    color:var(--text);
    font-size:13px;
    font-family:'Inter',sans-serif;
  }
  .search-box::placeholder{color:var(--text-faint);}
  .search-box:focus{outline:none; border-color:var(--gold);}
  .pos-filters{display:flex; gap:6px; flex-wrap:wrap;}
  .chip{
    font-family:'Roboto Mono',monospace;
    font-size:11px;
    font-weight:600;
    padding:7px 11px;
    border-radius:20px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--text-dim);
    cursor:pointer;
    letter-spacing:0.02em;
    position:relative;
  }
  .chip.has-dedicated::after{
    content:'';
    position:absolute;
    top:3px; right:3px;
    width:6px; height:6px;
    border-radius:50%;
    background:var(--gold);
  }
  .chip.active{
    background:var(--gold);
    border-color:var(--gold);
    color:#211705;
  }
  .hide-drafted-toggle{
    display:flex; align-items:center; gap:6px;
    font-size:12px; color:var(--text-dim);
    cursor:pointer;
    font-family:'Roboto Mono',monospace;
    white-space:nowrap;
  }
  .hide-drafted-toggle input{accent-color:var(--gold);}
  .news-counter{
    font-family:'Roboto Mono',monospace;
    font-size:10.5px;
    color:var(--text-faint);
    white-space:nowrap;
  }

  /* BOARD */
  .board{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
  }
  .tier-divider{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 16px;
    background:var(--panel-2);
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
  }
  .tier-divider:first-child{border-top:none;}
  .tier-num{
    font-family:'Oswald',sans-serif;
    font-size:12px;
    font-weight:700;
    color:var(--gold);
    letter-spacing:0.04em;
  }
  .tier-line{
    flex:1;
    height:1px;
    background:repeating-linear-gradient(90deg, var(--line) 0, var(--line) 4px, transparent 4px, transparent 8px);
  }
  .tier-note{
    font-family:'Roboto Mono',monospace;
    font-size:10px;
    color:var(--text-faint);
    white-space:nowrap;
  }
  .tier-note.warn{color:var(--danger);}

  .player-row{
    display:grid;
    grid-template-columns:44px 1fr 60px 44px 90px;
    align-items:center;
    gap:10px;
    padding:10px 16px;
    border-bottom:1px solid var(--line);
  }
  .player-row:last-child{border-bottom:none;}
  .player-row.drafted{opacity:0.35;}
  .player-row.drafted .player-name{text-decoration:line-through;}
  .player-row.mine{background:rgba(232,176,75,0.06);}
  .player-row.top-rec{
    background:rgba(232,176,75,0.1);
  }
  .rk-col{
    font-family:'Roboto Mono',monospace;
    font-size:12px;
    color:var(--text-faint);
    text-align:right;
  }
  .name-col{overflow:hidden;}
  .player-name{
    font-size:14px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .player-sub{
    font-size:11px;
    color:var(--text-faint);
    margin-top:1px;
  }
  .bye-col{
    font-family:'Roboto Mono',monospace;
    font-size:11px;
    color:var(--text-faint);
    text-align:center;
  }
  .need-col{
    display:flex; justify-content:center;
  }
  .need-dot{
    width:8px; height:8px; border-radius:50%;
  }
  .need-dot.crit{background:var(--danger);}
  .need-dot.med{background:var(--gold);}
  .need-dot.low{background:var(--text-faint);}
  .need-dot.none{background:transparent; border:1px solid var(--line);}
  .action-col{
    display:flex; gap:4px; justify-content:flex-end;
  }
  .mini-btn{
    font-family:'Roboto Mono',monospace;
    font-size:10px;
    font-weight:700;
    padding:6px 8px;
    border-radius:5px;
    cursor:pointer;
    border:1px solid var(--line);
    background:var(--panel-2);
    color:var(--text-dim);
    white-space:nowrap;
  }
  .mini-btn.mine-btn:hover{border-color:var(--gold); color:var(--gold);}
  .mini-btn.taken-btn:hover{border-color:var(--text-dim); color:var(--text);}
  .mini-btn.undo-btn{border-color:var(--line); color:var(--text-faint);}
  .mini-btn.undo-btn:hover{color:var(--danger); border-color:var(--danger);}

  .empty-state{
    padding:40px 20px;
    text-align:center;
    color:var(--text-faint);
    font-size:13px;
  }

  footer{
    margin-top:24px;
    text-align:center;
    font-size:11px;
    color:var(--text-faint);
    font-family:'Roboto Mono',monospace;
  }
</style>
</head>

const POS_COLOR = { QB:'var(--qb)', RB:'var(--rb)', WR:'var(--wr)', TE:'var(--te)', DST:'var(--dst)', K:'var(--k)' };

// ---- LEAGUE PROFILES (fully user-defined) ----
// No hardcoded leagues in this fork — every league is created, edited, and
// deleted by the person using the app, stored under their own account.
// Each entry has this shape:
// {
//   id, name, starterSlots: [{id,label,eligible:[pos,...]}, ...], benchCount,
//   excludedPositions: [...] (auto-derived from starterSlots),
//   needCap: {pos: maxCount, ...} (optional, per position),
//   premiumType: pos|null, premiumBonus, premiumLabel, premiumDefault,
//   notes: [{label,value}, ...] (free-form scoring reference)
// }
let leagues = {};
let activeLeagueId = null; // null until a league exists and one is selected

function deriveExcludedPositions(starterSlots){
  const allPos = ['QB','RB','WR','TE','DST','K'];
  return allPos.filter(pos => !starterSlots.some(s => s.eligible.includes(pos)));
}

function saveLeaguesList(){
  if(!window.storage) return Promise.resolve();
  return window.storage.set('leagues-list', JSON.stringify(leagues), false).catch(err => {
    console.error('Failed to save leagues list:', err);
  });
}

function saveActiveLeagueId(){
  if(!window.storage) return Promise.resolve();
  return window.storage.set('active-league-id', activeLeagueId || '', false).catch(err => {
    console.error('Failed to save active league id:', err);
  });
}

function createOrUpdateLeague(config){
  const id = config.id || (slugify(config.name) + '-' + Date.now().toString(36));
  leagues[id] = {
    id,
    name: config.name,
    starterSlots: config.starterSlots,
    benchCount: config.benchCount,
    excludedPositions: deriveExcludedPositions(config.starterSlots),
    needCap: config.needCap || {},
    premiumType: config.premiumType || null,
    premiumBonus: config.premiumBonus || 0,
    premiumLabel: config.premiumLabel || '',
    premiumDefault: !!config.premiumDefault,
    notes: config.notes || [],
  };

}

function deleteLeague(id){
  delete leagues[id];
  saveLeaguesList();
  // Clean up that league's own draft/pool/tags data too, not just the profile.
  if(window.storage){
    window.storage.delete(`draft-state-${id}`, false).catch(()=>{});
    window.storage.delete(`player-pool-${id}`, false).catch(()=>{});

}

// Safe defaults until a league is actually loaded/selected — the empty

let BENCH_COUNT = 0;
let premiumOn = false;

// state.leagueForm holds the in-progress form; null means no form is open.
// Slot rows use a tempId (not the final slot id) since slots can be

function validateLeagueForm(f){
  if(!f.name.trim()) return 'Give the league a name.';
  if(f.slots.length === 0) return 'Add at least one starter slot.';
  if(f.slots.some(s => !s.label.trim())) return 'Every slot needs a label.';
  if(f.slots.some(s => s.eligible.length === 0)) return 'Every slot needs at least one eligible position.';
  if(f.benchCount < 0 || !Number.isFinite(f.benchCount)) return 'Bench size must be zero or more.';
  if(f.premiumEnabled && !f.premiumLabel.trim()) return 'Give the scoring bonus a short label (shown on the toggle).';
  return null;
}

function saveLeagueForm(){
  const f = state.leagueForm;
  const err = validateLeagueForm(f);
  if(err){ f.error = err; render(); return; }

  const config = {
    id: f.editingId,
    name: f.name.trim(),
    starterSlots: f.slots.map((s, i) => ({ id: `SLOT${i}_${s.label.replace(/[^A-Za-z0-9]/g,'')}`, label: s.label.trim(), eligible: s.eligible })),
    benchCount: Math.floor(f.benchCount),
    needCap: Object.fromEntries(Object.entries(f.caps).filter(([,v]) => v !== '' && v !== null && v !== undefined && !isNaN(v)).map(([k,v]) => [k, Math.floor(Number(v))])),
    premiumType: f.premiumEnabled ? f.premiumType : null,
    premiumBonus: f.premiumEnabled ? Math.floor(Number(f.premiumBonus) || 0) : 0,
    premiumLabel: f.premiumEnabled ? f.premiumLabel.trim() : '',
    premiumDefault: f.premiumEnabled ? f.premiumDefault : false,
    notes: f.notes.filter(n => n.label.trim() || n.value.trim()),
  };

  const wasNew = !f.editingId;
  const id = createOrUpdateLeague(config);
  state.leagueForm = null;

  if(wasNew || activeLeagueId === id){
    // Switching into the new/edited league fresh — mirrors switchLeague()'s
    // reset, since a structural edit can invalidate old roster slot ids.
    if(saveTimer){ clearTimeout(saveTimer); saveTimer = null; }
    if(saveRetryTimer){ clearTimeout(saveRetryTimer); saveRetryTimer = null; }
    saveRetryCount = 0; saveStatus = 'ok';
    activeLeagueId = id;
    STARTER_SLOTS = leagues[id].starterSlots;
    BENCH_COUNT = leagues[id].benchCount;
    premiumOn = leagues[id].premiumDefault;
    pools = { ALL: DEFAULT_PLAYERS, QB:null, RB:null, WR:null, TE:null, DST:null, K:null };
    state = {...state, drafted:{}, roster:{}, bench:[], posFilter:'ALL', search:'', hideDrafted:true, pick:1, tags:{}, tagModal:null, news:{claude:{}, fantasypros:{}}, newsLoading:{claude:{}, fantasypros:{}}, leagueForm:null, banner:{type:'ok', text:`${wasNew ? 'Created' : 'Updated'} "${config.name}".`}};
    saveActiveLeagueId();
    loadSavedSession();
  } else {
    render();
    saveDraftState();
  }
}

function deleteLeagueForm(id){
  const name = leagues[id] ? leagues[id].name : 'this league';

// ---- PLAYER POOLS ----
// ALL is the cross-position overall list — the ONLY thing "on the clock"
// recommendations ever use, since tiers from different position-specific
// lists aren't on a comparable scale (Tier 1 QB and Tier 1 RB don't mean
// the same real value). QB/RB/WR/TE/DST/K are optional dedicated uploads
// for more accurate tiering when *browsing* that position's tab — if one
// hasn't been uploaded, that tab falls back to filtering the ALL list by
// position, same as before this feature existed.
const POSITION_KEYS = ['QB','RB','WR','TE','DST','K'];
const POOL_KEYS = ['ALL', ...POSITION_KEYS];

let pools = { ALL: DEFAULT_PLAYERS, QB: null, RB: null, WR: null, TE: null, DST: null, K: null };
let uploadTargetPool = 'ALL'; // which pool the CSV/XLSX button uploads into, set at click-time

// Tracks, per league, per pool, the last CSV uploaded (or default) so the
// header can show exactly what's backing whichever tab you're viewing.
// Populated lazily per league id, since leagues are created dynamically
// rather than being a fixed known set.
function freshPoolMeta(){
  const m = {};
  POOL_KEYS.forEach(k => { m[k] = k === 'ALL' ? { ...DEFAULT_SOURCE_META, count: DEFAULT_PLAYERS.length } : { type:'none' }; });
  return m;
}
let leaguePoolMeta = {};
function ensurePoolMeta(id){
  if(!leaguePoolMeta[id]) leaguePoolMeta[id] = freshPoolMeta();
  return leaguePoolMeta[id];
}

// The pool actually driving the currently-viewed board tab. Falls back to
// filtering ALL by position when no dedicated pool has been uploaded.
function currentPoolPlayers(){
  const key = state.posFilter;
  if(key === 'ALL' || !pools[key]) return null; // null = "use ALL, filtered" — handled by caller
  return pools[key];
}

function formatSourceMeta(meta){
  if(!meta || meta.type === 'none'){
    return `No dedicated CSV uploaded for this tab — showing this position filtered from the ALL list.`;
  }
  if(meta.type === 'default'){
    return `Default FantasyPros Half-PPR data (${meta.count} players) &middot; no CSV uploaded yet`;
  }
  const dt = new Date(meta.uploadedAt);
  const dateStr = dt.toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'});
  const timeStr = dt.toLocaleTimeString(undefined, {hour:'numeric', minute:'2-digit'});
  return `${meta.filename} &middot; ${meta.count} players &middot; uploaded ${dateStr} at ${timeStr}`;
}

let state = {
  drafted: {},      // id -> {who:'mine'|'other', name, pos, team, tier, rk} snapshot
  roster: {},        // slotId -> id
  bench: [],          // array of ids
  posFilter: 'ALL',
  search: '',
  hideDrafted: true,
  pick: 1,
  benchOpen: false,
  scoringOpen: false,
  suggestionHidden: false,
  tags: {},          // id -> {type:'avoid'|'sleeper', note}
  tagModal: null,    // {id, type, note} while editing
  news: {claude:{}, fantasypros:{}},  // source -> id -> {status, headline, summary, source, checkedAt}
  newsLoading: {claude:{}, fantasypros:{}},   // source -> id -> true while a lookup is in flight
  newsInfoHidden: false, // privacy toggle: hide colored news text/details
  leagueForm: null, // in-progress create/edit league form, or null when closed
  banner: null,       // {type:'ok'|'err', text}
};

const TAG_DEFS = {
  avoid:   {label:'Avoid',   color:'var(--danger)', glyph:'\u2715'},
  sleeper: {label:'Sleeper', color:'var(--good)',    glyph:'z'},
  note:    {label:'Note',    color:'var(--note-yellow)', glyph:'\u270E'}, // plain note — no effect on recommendation scoring
};

const NEWS_STATUS_STYLE = {
  injury:     {color:'var(--danger)', glyph:'!'},
  suspension: {color:'var(--danger)', glyph:'!'},
  trade:      {color:'var(--wr)',     glyph:'\u21c4'},
  neutral:    {color:'var(--gold)',   glyph:'i'},
  no_news:    {color:'var(--text-faint)', glyph:'\u00b7'},
  error:      {color:'var(--text-faint)', glyph:'?'},
};

function slugify(name){
  return name.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
}

// Searches the ALL pool first (its data drives everything else — tier,
// rank, recommendations), then falls back to position-specific pools in
// case a player only exists there. This is what makes clicking MINE/TAKEN
// work correctly no matter which tab you were browsing when you clicked.
function playerById(id){
  const fromAll = pools.ALL.find(p => p.id === id);
  if(fromAll) return fromAll;
  for(const key of POSITION_KEYS){
    if(pools[key]){
      const p = pools[key].find(x => x.id === id);
      if(p) return p;
    }
  }
  return undefined;
}

// Positions this league never drafts (e.g. no K slot in John's League) are
// filtered out here, at every point the board/recommendation engine reads
// the pool — not deleted from the underlying data, so switching back to a
// league that does use them still works correctly. Always derived from the
// ALL pool, since recommendations must stay cross-position comparable.
function activePlayers(){
  const excl = leagues[activeLeagueId].excludedPositions || [];
  if(excl.length === 0) return pools.ALL;
  return pools.ALL.filter(p => !excl.includes(p.pos));
}

function getPlayerAny(id){
  const live = playerById(id);
  if(live) return live;
  const snap = state.drafted[id];
  if(snap) return {id, name:snap.name, pos:snap.pos, team:snap.team, tier:snap.tier ?? 99, rk:snap.rk ?? 9999, bye:snap.bye ?? null, stale:true};
  return null;
}

function isDrafted(id){ return state.drafted.hasOwnProperty(id); }

function assignToRoster(p){
  const openStarter = STARTER_SLOTS.find(s => !state.roster[s.id] && s.eligible.length===1 && s.eligible[0]===p.pos);
  if(openStarter){ state.roster[openStarter.id] = p.id; return; }
  const openFlex = STARTER_SLOTS.find(s => !state.roster[s.id] && s.eligible.length>1 && s.eligible.includes(p.pos));
  if(openFlex){ state.roster[openFlex.id] = p.id; return; }
  if(state.bench.length < BENCH_COUNT){ state.bench.push(p.id); return; }
}

function removeFromRoster(id){
  for(const s of STARTER_SLOTS){ if(state.roster[s.id] === id) delete state.roster[s.id]; }
  state.bench = state.bench.filter(r => r !== id);
}

// Tracks whether the "no CSV uploaded" warning has already been shown this
// session, per league, so it interrupts the first draft action only —
// not every pick after that.
let noCsvWarningShown = { shenanigans: false, johns: false };

// ---- CUSTOM CONFIRM MODAL ----
// Deliberately NOT using window.confirm()/alert() here: published artifacts
// often run in a stricter sandboxed frame than the live chat preview, and
// native browser dialogs can be silently blocked there — a click that does
// nothing, with no error. A plain in-app modal has no such dependency.
let confirmModal = null; // {message, onConfirm}

function showConfirm(message, onConfirm){
  confirmModal = { message, onConfirm };
  render();
}
function closeConfirm(){ confirmModal = null; render(); }
function confirmYes(){
  const cb = confirmModal ? confirmModal.onConfirm : null;
  confirmModal = null;
  render();
  if(cb) cb();
}

function renderConfirmModal(container){
  if(!confirmModal) return;
  const overlay = el('div','modal-overlay');
  overlay.onclick = (e) => { if(e.target === overlay) closeConfirm(); };
  const card = el('div','modal-card');
  card.appendChild(el('h3', null, 'Confirm'));
  const msgField = el('div','modal-field');
  msgField.innerHTML = `<div style="font-size:13px; color:var(--text-dim); line-height:1.5;">${confirmModal.message}</div>`;
  card.appendChild(msgField);
  const actions = el('div','modal-actions');
  const yesBtn = el('button','btn btn-mine','Yes, continue');
  yesBtn.onclick = () => confirmYes();
  actions.appendChild(yesBtn);
  const noBtn = el('button','btn btn-cancel','Cancel');
  noBtn.onclick = () => closeConfirm();
  actions.appendChild(noBtn);
  card.appendChild(actions);
  overlay.appendChild(card);
  container.appendChild(overlay);
}

function draftPlayer(id, who){
  const meta = ensurePoolMeta(activeLeagueId).ALL;
  const noCsv = !meta || meta.type === 'default';
  if(noCsv && !noCsvWarningShown[activeLeagueId]){
    noCsvWarningShown[activeLeagueId] = true; // only ask once per league per session, win or lose
    showConfirm(`Warning: no CSV uploaded for ${leagues[activeLeagueId].name} — you're drafting off the default bundled rankings, not a league-specific tier list. Continue anyway?`, () => performDraft(id, who));
    return;
  }
  performDraft(id, who);
}

function performDraft(id, who){
  const p = playerById(id);
  if(!p) return;
  state.drafted[id] = {who, name:p.name, pos:p.pos, team:p.team, tier:p.tier, rk:p.rk, bye:p.bye};
  if(who === 'mine'){ assignToRoster(p); }
  state.pick += 1;
  render();
  saveDraftState();
}

function undoDraft(id){
  delete state.drafted[id];
  removeFromRoster(id);
  render();
  saveDraftState();
}

function resetAll(){
  if(saveTimer){ clearTimeout(saveTimer); saveTimer = null; }
  if(saveRetryTimer){ clearTimeout(saveRetryTimer); saveRetryTimer = null; }
  saveRetryCount = 0;
  saveStatus = 'ok';
  const keepTags = state.tags; // notes/Avoid/Sleeper flags survive a draft reset — use "Reset notes" to clear those separately
  state = {drafted:{}, roster:{}, bench:[], posFilter:'ALL', search:'', hideDrafted:true, pick:1, benchOpen:false, scoringOpen:false, suggestionHidden:false, tags:keepTags, tagModal:null, news:{claude:{}, fantasypros:{}}, newsLoading:{claude:{}, fantasypros:{}}, newsInfoHidden:false, leagueForm:null, banner:null};
  render();
  // Overwrite the saved draft with this fresh (but tags-preserved) state —
  // deliberately not calling clearSavedDraft() here, since a delete racing
  // against this save could wipe out the tags we just tried to keep.
  saveDraftState();
}

function resetNotes(){
  state.tags = {};
  state.tagModal = null;
  state.banner = {type:'ok', text:`Cleared all notes for ${leagues[activeLeagueId].name}. Your draft progress was not affected.`};
  render();
  saveDraftState();
}

// ---- AUTOSAVE / RESTORE (uses artifact persistent storage — only works
// when this artifact is running inside claude.ai, not a downloaded file) ----
// Keys are namespaced per league so switching leagues never overwrites the
// other league's in-progress draft.
function draftKey(){ return `draft-state-${activeLeagueId}`; }
function poolKey(){ return `player-pool-${activeLeagueId}`; }

let saveTimer = null;
let saveStatus = 'ok';       // 'ok' | 'saving' | 'failed'
let saveRetryTimer = null;
let saveRetryCount = 0;
const MAX_SAVE_RETRIES = 4;
const SAVE_RETRY_DELAYS = [3000, 6000, 12000, 20000]; // backoff, ms

function saveDraftState(){
  // Debounced + only called from actual draft-changing actions (not every
  // render) so a burst of clicks doesn't fire a storage write for each one.
  if(saveTimer) clearTimeout(saveTimer);
  if(saveRetryTimer){ clearTimeout(saveRetryTimer); saveRetryTimer = null; } // a fresh user action supersedes any pending auto-retry
  saveRetryCount = 0;
  saveTimer = setTimeout(_doSaveDraftState, 500);
}

async function _doSaveDraftState(){
  if(!window.storage) return;
  saveStatus = 'saving';
  renderSaveIndicator();
  try{
    const snapshot = {
      drafted: state.drafted,
      roster: state.roster,
      bench: state.bench,
      tags: state.tags,
      news: state.news,
      pick: state.pick,
      premiumOn: premiumOn,
      posFilter: state.posFilter,
      hideDrafted: state.hideDrafted,
      savedAt: Date.now()
    };
    await window.storage.set(draftKey(), JSON.stringify(snapshot), false);
    saveStatus = 'ok';
    saveRetryCount = 0;
    renderSaveIndicator();
  } catch(err){
    // Transient backend hiccup. Rather than only retrying on the next user
    // action (which silently drops this save if you stop right after a
    // failure), automatically retry a few times with backoff. State stays
    // correct in memory the whole time either way.
    console.error(`Autosave failed (attempt ${saveRetryCount + 1}/${MAX_SAVE_RETRIES + 1}):`, err);
    saveStatus = 'failed';
    renderSaveIndicator();
    if(saveRetryCount < MAX_SAVE_RETRIES){
      const delay = SAVE_RETRY_DELAYS[saveRetryCount];
      saveRetryCount += 1;
      saveRetryTimer = setTimeout(_doSaveDraftState, delay);
    }
  }
}

// Updates just the small sync-status indicator in the header without a full
// re-render, so a background retry doesn't fight with whatever else the UI
// happens to be doing at that moment (e.g. mid-typing in a text field).
function renderSaveIndicator(){
  const el2 = document.getElementById('save-indicator');
  if(!el2) return;
  el2.className = 'save-indicator ' + saveStatus;
  el2.textContent = saveStatus === 'ok' ? 'Synced'
    : saveStatus === 'saving' ? 'Saving…'
    : `Not saved — retrying (${saveRetryCount}/${MAX_SAVE_RETRIES})`;
}

async function savePlayerPool(){
  if(!window.storage) return;
  try{
    // One combined write per league covering every pool (ALL + any
    // position-specific uploads), rather than a separate key per position.
    const payload = { pools: {}, meta: ensurePoolMeta(activeLeagueId) };
    POOL_KEYS.forEach(k => { payload.pools[k] = pools[k]; });
    await window.storage.set(poolKey(), JSON.stringify(payload), false);
  } catch(err){
    console.error('Failed to save player pools:', err);
  }
}


async function loadSavedSession(){
  if(!window.storage){ render(); return; }

  try{
    const poolRes = await window.storage.get(poolKey(), false);
    if(poolRes && poolRes.value){
      const parsed = JSON.parse(poolRes.value);
      if(parsed.pools){
        POOL_KEYS.forEach(k => {
          if(parsed.pools[k] && parsed.pools[k].length){ pools[k] = parsed.pools[k]; }
        });
      } else if(parsed.players && parsed.players.length){
        // Backward-compat: older saves only had a single ALL pool.
        pools.ALL = parsed.players;
      }
      if(parsed.meta){
        POOL_KEYS.forEach(k => { if(parsed.meta[k]) ensurePoolMeta(activeLeagueId)[k] = parsed.meta[k]; });
      }
    }
  } catch(err){ /* no saved pool for this league — use the bundled default */ }

  try{
    const draftRes = await window.storage.get(draftKey(), false);
    if(draftRes && draftRes.value){
      const parsed = JSON.parse(draftRes.value);
      state.drafted = parsed.drafted || {};
      state.roster = parsed.roster || {};
      state.bench = parsed.bench || [];
      state.tags = parsed.tags || {};
      // Guard against the older flat {id: info} shape from before news had
      // separate Claude/FantasyPros sources — treat it as incompatible
      // rather than crash, since it's just cached lookups, easily rerun.
      state.news = (parsed.news && parsed.news.claude && parsed.news.fantasypros)
        ? parsed.news
        : {claude:{}, fantasypros:{}};
      state.pick = parsed.pick || 1;
      if(typeof parsed.premiumOn === 'boolean') premiumOn = parsed.premiumOn;
      state.posFilter = parsed.posFilter || 'ALL';
      state.hideDrafted = typeof parsed.hideDrafted === 'boolean' ? parsed.hideDrafted : true;
      const when = parsed.savedAt ? new Date(parsed.savedAt).toLocaleString() : 'earlier';
      state.banner = {type:'ok', text:`Restored your saved ${leagues[activeLeagueId].name} draft — pick ${state.pick}, last saved ${when}.`};
    } else {
      state.banner = {type:'ok', text:`Switched to ${leagues[activeLeagueId].name} — starting a fresh draft.`};
    }
  } catch(err){ /* no saved draft — fresh start */ }

  render();
}

// ---- BACKUP: download/restore your draft as a plain JSON file ----
// Unlike autosave, this is pure client-side file I/O — no Claude session,
// no window.storage, no network call. It works even if you're logged out or
// using the downloaded standalone HTML file, which makes it the fallback
// worth using if you're ever unsure whether cloud autosave is available.
function exportBackup(){
  const backup = {
    format: 'draft-room-backup',
    version: 2,
    exportedAt: Date.now(),
    activeLeagueId: activeLeagueId,
    poolMeta: ensurePoolMeta(activeLeagueId),
    pools: pools,
    draft: {
      drafted: state.drafted,
      roster: state.roster,
      bench: state.bench,
      tags: state.tags,
      news: state.news,
      pick: state.pick,
      premiumOn: premiumOn,
      posFilter: state.posFilter,
      hideDrafted: state.hideDrafted,
    }
  };
  const json = JSON.stringify(backup, null, 2);
  const blob = new Blob([json], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const stamp = new Date().toISOString().slice(0,16).replace(/[T:]/g,'-');
  const a = document.createElement('a');
  a.href = url;
  a.download = `${activeLeagueId}-draft-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  state.banner = {type:'ok', text:`Downloaded a backup of ${leagues[activeLeagueId].name} — pick ${state.pick}.`};
  render();
}

function handleBackupUpload(file){
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const backup = JSON.parse(e.target.result);
      if(!backup || !backup.draft || !(Array.isArray(backup.players) || backup.pools)){
        throw new Error("That doesn't look like a draft backup file from this app.");
      }
      if(backup.activeLeagueId && leagues[backup.activeLeagueId]){
        activeLeagueId = backup.activeLeagueId;
        STARTER_SLOTS = leagues[activeLeagueId].starterSlots;
        BENCH_COUNT = leagues[activeLeagueId].benchCount;
      }
      if(backup.pools){
        // Current (v2) backup format — every pool, ALL plus any uploaded positions.
        POOL_KEYS.forEach(k => { pools[k] = backup.pools[k] || (k === 'ALL' ? DEFAULT_PLAYERS : null); });
        if(backup.poolMeta) POOL_KEYS.forEach(k => { if(backup.poolMeta[k]) ensurePoolMeta(activeLeagueId)[k] = backup.poolMeta[k]; });
      } else {
        // Backward-compat with older (v1) single-pool backups.
        pools.ALL = backup.players.length ? backup.players : DEFAULT_PLAYERS;
        POSITION_KEYS.forEach(k => { pools[k] = null; });
        if(backup.sourceMeta) ensurePoolMeta(activeLeagueId).ALL = backup.sourceMeta;
      }

      const d = backup.draft;
      state.drafted = d.drafted || {};
      state.roster = d.roster || {};
      state.bench = d.bench || [];
      state.tags = d.tags || {};
      state.news = (d.news && d.news.claude && d.news.fantasypros) ? d.news : {claude:{}, fantasypros:{}};
      state.pick = d.pick || 1;
      premiumOn = typeof d.premiumOn === 'boolean' ? d.premiumOn : leagues[activeLeagueId].premiumDefault;
      state.posFilter = 'ALL';
      state.hideDrafted = typeof d.hideDrafted === 'boolean' ? d.hideDrafted : true;

      const when = backup.exportedAt ? new Date(backup.exportedAt).toLocaleString() : 'an earlier backup';
      state.banner = {type:'ok', text:`Restored ${leagues[activeLeagueId].name} from backup (${when}) — pick ${state.pick}.`};
      render();
      // Persist the restored state going forward too, if cloud autosave is available.
      saveDraftState();
      savePlayerPool();
    } catch(err){
      state.banner = {type:'err', text:'Restore failed: ' + err.message};
      render();
    }
  };
  reader.onerror = () => {
    state.banner = {type:'err', text:'Could not read that file.'};
    render();
  };
  reader.readAsText(file);
}

// ---- NEWS LOOKUP (on-demand, calls Claude with web search) ----
// Session-only tally of news checks — this can NOT reflect your actual
// account-wide Claude usage limit (that data isn't exposed to artifact
// code at all). It's just a local count of clicks made in this session,
// for your own awareness, and resets on reload.
let newsCheckCount = 0;

async function checkPlayerNews(id){
  if(state.newsLoading.claude[id]) return; // guard against double-firing
  const p = getPlayerAny(id);
  if(!p) return;
  state.newsLoading.claude[id] = true;
  newsCheckCount += 1;
  render();
  try{
    const prompt = `Search the web for the most recent NFL news (last 14 days) about the fantasy football player "${p.name}", who plays ${p.pos} for the ${p.team}. Focus only on things that would change their fantasy football value: injuries, trades, suspensions, depth chart or role changes, or coach comments about usage. Respond with ONLY a raw JSON object, no markdown fences, no extra text, in exactly this shape: {"status":"injury"|"trade"|"suspension"|"neutral"|"no_news","headline":"under 12 words","summary":"1-2 sentences, under 260 characters, in your own words","source":"publication name"}. If you find nothing fantasy-relevant in the last 14 days, return status "no_news" with empty headline and summary.`;
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [{ role: "user", content: prompt }],
        tools: [{ type: "web_search_20250305", name: "web_search" }]
      })
    });
    const data = await response.json();
    const textBlocks = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
    const clean = textBlocks.replace(/```json|```/g, '').trim();
    let parsed;
    try{ parsed = JSON.parse(clean); }
    catch(e){ parsed = {status:'error', headline:'Could not read the response', summary:''}; }
    state.news.claude[id] = { ...parsed, checkedAt: Date.now() };
  } catch(err){
    state.news.claude[id] = { status:'error', headline:'News check failed', summary: String(err.message || err), checkedAt: Date.now() };
  }
  delete state.newsLoading.claude[id];
  render();
  saveDraftState();
}

// ---- CSV UPLOAD ----
function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\n' || c === '\r'){
        if(c === '\r' && text[i+1]==='\n') i++;
        row.push(field); field='';
        if(row.length > 1 || row[0] !== '') rows.push(row);
        row = [];
      } else field += c;
    }
  }
  if(field.length>0 || row.length>0){ row.push(field); rows.push(row); }
  return rows;
}

// Cell helpers used by every parser branch below, so the same logic works
// whether a cell came from CSV text (always a string) or a parsed XLSX sheet
// (numbers, blanks, and strings all mixed together).
function asStr(v){
  if(v === null || v === undefined) return '';
  if(typeof v === 'number' && isNaN(v)) return '';
  return String(v).trim();
}
function asNum(v){
  if(v === null || v === undefined || v === '') return null;
  const n = typeof v === 'number' ? v : parseFloat(String(v).replace(/,/g,''));
  return isNaN(n) ? null : n;
}

// ---- FORMAT DETECTION ----
// Looks at the header row(s) to figure out which known layout this is,
// without requiring the file to be a specific type (csv vs xlsx).
function detectFormat(rows){
  const header0 = (rows[0] || []).map(c => asStr(c).toUpperCase());
  // Only PLAYER NAME is required — POS is common but position-specific
  // FantasyPros exports (e.g. "RB Rankings") often omit it entirely, since
  // every row is obviously that position already.
  if(header0.includes('PLAYER NAME')) return 'fantasypros';
  const looksLikeDraftSharks = header0[0] === 'RK' &&
    (header0.includes('ADP') || header0.includes('FLOOR') || header0.includes('CEILING') || header0.includes('CONSENSUS') || header0.includes('3D VALUE'));
  if(looksLikeDraftSharks) return 'draftsharks';
  return 'unknown';
}

// ---- PARSER: FantasyPros (one row per player) ----
// impliedPos: the position tab this file is being uploaded into (e.g. 'RB'),
// used to fill in each player's position when the file itself has no POS
// column — exactly the case for FantasyPros' own position-specific exports.
function fantasyProsRowsToPlayers(rows, impliedPos){
  const headers = rows[0].map(h => asStr(h).toUpperCase());
  const idx = {
    rk: headers.indexOf('RK'),
    tier: headers.indexOf('TIERS'),
    name: headers.indexOf('PLAYER NAME'),
    team: headers.indexOf('TEAM'),
    pos: headers.indexOf('POS'),
    bye: headers.indexOf('BYE WEEK'),
  };
  if(idx.pos === -1 && (!impliedPos || impliedPos === 'ALL')){
    throw new Error("This file has no POS column, so positions can't be determined. If this is a position-specific export (e.g. 'RB Rankings'), upload it to that position's own tab instead of ALL.");
  }
  const players = [];
  for(let i=1;i<rows.length;i++){
    const r = rows[i];
    const nameRaw = asStr(r[idx.name]);
    if(!nameRaw) continue;
    const posRaw = idx.pos > -1 ? asStr(r[idx.pos]) : '';
    const m = posRaw.match(/^([A-Z]+)(\d+)$/);
    const pos = m ? m[1] : (posRaw || impliedPos);
    const posRank = m ? parseInt(m[2]) : null;
    const bye = idx.bye > -1 ? asNum(r[idx.bye]) : null;
    const rk = idx.rk > -1 ? asNum(r[idx.rk]) : i;
    const tier = idx.tier > -1 ? asNum(r[idx.tier]) : 99;
    players.push({
      id: slugify(nameRaw),
      rk: rk === null ? i : rk,
      tier: tier === null ? 99 : tier,
      name: nameRaw,
      team: idx.team > -1 ? asStr(r[idx.team]) : '',
      pos: pos,
      posRank: posRank,
      bye: bye
    });
  }
  if(players.length === 0) throw new Error('No player rows found in that file.');
  return players;
}

// ---- PARSER: Draft Sharks (pasted-from-website, 4 rows per player) ----
// Layout observed: a stats row (RK in col 0, Bye in col 4), then a name row,
// a team row, and a position+rank row (e.g. "TE12"), each with the value in
// column 1. Standalone rows like "Tier 3" mark tier boundaries in between.
function draftSharksRowsToPlayers(rows){
  const players = [];
  let currentTier = 1;
  let i = 0;
  while(i < rows.length){
    const row = rows[i] || [];
    const c0 = asStr(row[0]);
    const tierMatch = c0.match(/^Tier\s+(\d+)/i);
    if(tierMatch){
      currentTier = parseInt(tierMatch[1]);
      i += 1;
      continue;
    }
    if(/^\d+$/.test(c0)){
      const rk = parseInt(c0);
      const bye = asNum(row[4]);
      const nameRow = rows[i+1] || [];
      const teamRow = rows[i+2] || [];
      const posRow = rows[i+3] || [];
      const name = asStr(nameRow[1]);
      const team = asStr(teamRow[1]);
      const posRaw = asStr(posRow[1]);
      if(name){
        const m = posRaw.match(/^([A-Z]+)(\d+)$/);
        let pos = m ? m[1] : posRaw;
        const posRank = m ? parseInt(m[2]) : null;
        if(pos === 'DEF') pos = 'DST'; // normalize to match this app's position taxonomy
        players.push({
          id: slugify(name),
          rk: rk,
          tier: currentTier,
          name: name,
          team: team,
          pos: pos,
          posRank: posRank,
          bye: bye === null ? null : Math.round(bye)
        });
      }
      i += 4;
      continue;
    }
    i += 1; // blank/unrecognized filler row — skip
  }
  if(players.length === 0) throw new Error("No player rows found — the Draft Sharks layout may have changed since this was built.");
  return players;
}

function rowsToPlayers(rows, targetPool){
  if(rows.length < 2) throw new Error('File looks empty.');
  const format = detectFormat(rows);
  if(format === 'fantasypros') return fantasyProsRowsToPlayers(rows, targetPool);
  if(format === 'draftsharks') return draftSharksRowsToPlayers(rows);
  throw new Error("Couldn't recognize this file's layout — expected a FantasyPros or Draft Sharks rankings export.");
}

function handleCSVUpload(file, targetPool){
  const isExcel = /\.(xlsx|xls)$/i.test(file.name);
  const reader = new FileReader();

  reader.onload = (e) => {
    try{
      let rows;
      if(isExcel){
        if(typeof XLSX === 'undefined'){
          throw new Error('Spreadsheet reader failed to load — check your connection and try again.');
        }
        const workbook = XLSX.read(e.target.result, {type:'array'});
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:true, defval:''});
      } else {
        rows = parseCSV(e.target.result);
      }

      let newPlayers = rowsToPlayers(rows, targetPool);
      let mismatchNote = '';

      if(targetPool !== 'ALL'){
        const matching = newPlayers.filter(p => p.pos === targetPool);
        const droppedCount = newPlayers.length - matching.length;
        if(matching.length === 0){
          throw new Error(`This file doesn't appear to contain any ${targetPool} players — did you upload the right file for the ${targetPool} tab?`);
        }
        if(droppedCount > 0){
          mismatchNote = ` (${droppedCount} non-${targetPool} row${droppedCount>1?'s':''} in the file were ignored.)`;
        }
        newPlayers = matching;
      }

      const newIds = new Set(newPlayers.map(p => p.id));
      const missing = targetPool === 'ALL' ? Object.keys(state.drafted).filter(id => !newIds.has(id)) : [];
      pools[targetPool] = newPlayers;
      const meta = { type:'upload', filename: file.name, count: newPlayers.length, uploadedAt: Date.now() };
      ensurePoolMeta(activeLeagueId)[targetPool] = meta;
      let msg = `Loaded ${newPlayers.length} players into the ${targetPool} tab from ${file.name}.${mismatchNote}`;
      if(missing.length){
        msg += ` ${missing.length} previously-drafted player${missing.length>1?'s':''} not found in this file (kept, shown as stale).`;
      }
      state.banner = {type:'ok', text: msg};
      savePlayerPool();
    } catch(err){
      state.banner = {type:'err', text: 'Upload failed: ' + err.message};
    }
    render();
  };
  reader.onerror = () => {
    state.banner = {type:'err', text:'Could not read that file.'};
    render();
  };

  if(isExcel){ reader.readAsArrayBuffer(file); }
  else { reader.readAsText(file); }
}

// ---- NEED CALCULATION ----
function openStarterSlotsForPos(pos){
  return STARTER_SLOTS.filter(s => !state.roster[s.id] && s.eligible.includes(pos));
}
function exactOpenSlot(pos){
  return STARTER_SLOTS.some(s => !state.roster[s.id] && s.eligible.length===1 && s.eligible[0]===pos);
}
function countMineAtPos(pos){
  return Object.values(state.drafted).filter(d => d.who === 'mine' && d.pos === pos).length;
}

function needLevel(pos){
  // Some league setups treat one player at a position as fully covering
  // it — a personal strategy call, not something the recommendation
  // engine should keep second-guessing. Once you hit that cap, need
  // drops to zero outright, bypassing flex eligibility and bench depth.
  const cap = leagues[activeLeagueId].needCap && leagues[activeLeagueId].needCap[pos];
  if(cap !== undefined && countMineAtPos(pos) >= cap) return 0;
  if(exactOpenSlot(pos)) return 3;
  if(openStarterSlotsForPos(pos).length > 0) return 2;
  if(state.bench.length < BENCH_COUNT) return 1;
  return 0;
}
function needClass(level){
  if(level===3) return 'crit';
  if(level===2) return 'med';
  if(level===1) return 'low';
  return 'none';
}

function isCappedOut(pos){
  const cap = leagues[activeLeagueId].needCap && leagues[activeLeagueId].needCap[pos];
  return cap !== undefined && countMineAtPos(pos) >= cap;
}

function needTooltip(level, pos){
  if(pos && isCappedOut(pos)) return `No need — you've already drafted your ${pos}, treated as fully covered per this league's setup`;
  if(level===3) return 'Critical need — you have an open starter slot for this position';
  if(level===2) return 'Medium need — could fill one of your flex spots';
  if(level===1) return 'Low need — starters are full, this would just be bench depth';
  return 'No need — your whole roster is full at this position';
}

function recommendationScore(p){
  // Tier is the dominant signal — being one tier better should outweigh
  // small rank differences and moderate need differences, but not be
  // overridden by them either.
  const TIER_STEP = 100;
  const tierScore = (17 - p.tier) * TIER_STEP;

  // Rank only breaks ties within/near a tier — max swing across the whole
  // board (~850 players) is well under one tier step.
  const rankScore = (900 - p.rk) * 0.05;

  // Need is a real nudge (roughly one tier's worth at max), not a dominant term.
  const need = needLevel(p.pos) * 40;

  let score = tierScore + rankScore + need;

  // League-specific premium: a flat, capped bonus reflecting whatever scoring
  // rule most deviates from a generic Half-PPR ranking for this league —
  // enough to move a player ahead of similarly-valued peers at other
  // positions, not enough to jump multiple tiers of actual draft capital.
  const league = leagues[activeLeagueId];
  if(premiumOn && p.pos === league.premiumType){ score += league.premiumBonus; }

  // Your own notes override everything else in the pool: Avoid effectively
  // takes a player out of consideration; Sleeper gives a modest nudge up.
  const tag = state.tags[p.id];
  if(tag){
    if(tag.type === 'avoid') score -= 100000;
    else if(tag.type === 'sleeper') score += 50;
  }

  return score;
}

function bestAvailable(){
  const avail = activePlayers().filter(p => !isDrafted(p.id));
  if(avail.length === 0) return null;
  let best = avail[0], bestScore = -Infinity;
  for(const p of avail){
    const s = recommendationScore(p);
    if(s > bestScore){ bestScore = s; best = p; }
  }
  return best;
}

function tierScarcityNote(tier, players){
  const inTier = players.filter(p => p.tier === tier && !isDrafted(p.id));
  const byPos = {};
  inTier.forEach(p => { byPos[p.pos] = (byPos[p.pos]||0) + 1; });
  const warnings = Object.entries(byPos).filter(([pos,count]) => count <= 2 && needLevel(pos) >= 2);
  if(warnings.length === 0) return null;
  return warnings.map(([pos,count]) => `${count} ${pos} left`).join(' · ');
}

function reasonFor(p){
  const lvl = needLevel(p.pos);
  const parts = [];
  if(isCappedOut(p.pos)) parts.push(`you've already drafted your ${p.pos} — not pushing for another, per this league's setup`);
  else if(lvl===3) parts.push(`fills your open ${p.pos} slot`);
  else if(lvl===2) parts.push(`fills a flex spot`);
  else if(lvl===1) parts.push(`best bench depth`);
  else parts.push(`roster is full at ${p.pos} — highest value left`);
  parts.push(`Tier ${p.tier}, ranked #${p.rk} overall`);
  if(premiumOn && p.pos === leagues[activeLeagueId].premiumType) parts.push(`${leagues[activeLeagueId].premiumLabel} bump applied`);
  const tag = state.tags[p.id];
  if(tag && tag.type !== 'note') parts.push(`you flagged this player: ${TAG_DEFS[tag.type].label}`);
  return parts.join(' · ');
}

function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html !== undefined) e.innerHTML = html;
  return e;
}

function posTagHTML(pos){
  return `<span class="pos-tag" style="background:${POS_COLOR[pos]||'var(--k)'}">${pos}</span>`;
}

function renderClockCard(container){
  const card = el('div','clock-card');
  const rec = bestAvailable();
  const header = el('div','clock-header');
  header.innerHTML = `<span class="pulse-dot"></span><span>On the clock &middot; Pick ${state.pick}</span>`;
  header.appendChild(el('div','clock-header-spacer'));
  const hideBtn = el('button','hide-toggle-btn', state.suggestionHidden ? '&#128065; Show' : '&#128065; Hide');
  hideBtn.onclick = () => { state.suggestionHidden = !state.suggestionHidden; render(); };
  header.appendChild(hideBtn);
  card.appendChild(header);

  if(state.suggestionHidden){
    const hidden = el('div','rec-hidden');
    hidden.innerHTML = `<div class="eye-icon">&#128065;&#65039;&#8205;&#128488;&#65039;</div><div class="hidden-txt">Suggestion hidden — tap Show when it's clear.</div>`;
    if(rec){
      const revealBtn = el('button','btn btn-taken','Show suggestion');
      revealBtn.onclick = () => { state.suggestionHidden = false; render(); };
      hidden.appendChild(revealBtn);
    }
    card.appendChild(hidden);
    container.appendChild(card);
    return;
  }

  if(!rec){
    card.appendChild(el('div','rec-empty','All ranked players have been drafted.'));
  } else {
    card.appendChild(el('div','rec-name', rec.name));
    const meta = el('div','rec-meta');
    meta.innerHTML = posTagHTML(rec.pos) + `<span class="team-tag">${rec.team}</span><span class="tier-tag">Tier ${rec.tier} &middot; Bye ${rec.bye ?? '—'}</span>`;
    meta.appendChild(renderBadgeRow(rec));
    card.appendChild(meta);
    const recNewsLine = renderNewsLine(rec);
    if(recNewsLine) card.appendChild(recNewsLine);
    card.appendChild(el('div','rec-reason', reasonFor(rec)));
    const actions = el('div','rec-actions');
    const mineBtn = el('button','btn btn-mine','Draft to my team');
    mineBtn.onclick = () => draftPlayer(rec.id,'mine');
    const takenBtn = el('button','btn btn-taken','Someone else took them');
    takenBtn.onclick = () => draftPlayer(rec.id,'other');
    actions.appendChild(mineBtn); actions.appendChild(takenBtn);
    card.appendChild(actions);
  }
  container.appendChild(card);
}

function renderLeagueCard(container){

function renderBoard(container){

function fillBoard(board){
  board.innerHTML = '';
  // When a dedicated tier list has been uploaded for this specific position
  // tab, use it directly (with its own tier numbers) instead of filtering
  // the ALL list by position — this is the whole point of per-position
  // uploads: FantasyPros' own position-specific tiering, not an approximation.
  const dedicatedPool = state.posFilter !== 'ALL' ? pools[state.posFilter] : null;
  let list = dedicatedPool || activePlayers();
  if(!dedicatedPool && state.posFilter !== 'ALL') list = list.filter(p => p.pos === state.posFilter);
  if(state.search.trim()) {
    const q = state.search.trim().toLowerCase();
    list = list.filter(p => p.name.toLowerCase().includes(q));
  }
  if(state.hideDrafted) list = list.filter(p => !isDrafted(p.id));

  if(list.length === 0){
    board.appendChild(el('div','empty-state','No players match your filters.'));
    return;
  }

  const rec = bestAvailable();
  let lastTier = null;
  list.forEach(p => {
    if(p.tier !== lastTier){
      lastTier = p.tier;
      const divider = el('div','tier-divider');
      divider.appendChild(el('div','tier-num', `TIER ${p.tier}`));
      divider.appendChild(el('div','tier-line'));
      const note = tierScarcityNote(p.tier, dedicatedPool || activePlayers());
      if(note) divider.appendChild(el('div','tier-note warn', note));
      board.appendChild(divider);
    }
    const drafted = isDrafted(p.id);
    const who = drafted ? state.drafted[p.id].who : null;
    let rowClass = 'player-row';
    if(drafted) rowClass += ' drafted';
    if(who === 'mine') rowClass += ' mine';
    if(rec && rec.id === p.id && !drafted && !state.suggestionHidden) rowClass += ' top-rec';
    const row = el('div', rowClass);

    row.appendChild(el('div','rk-col', '#'+p.rk));

    const nameCol = el('div','name-col');
    nameCol.appendChild(el('div','player-name', p.name));
    const sub = el('div','player-sub');
    sub.innerHTML = posTagHTML(p.pos) + `<span style="margin-left:5px">${p.team}</span>`;
    sub.appendChild(renderBadgeRow(p));
    nameCol.appendChild(sub);
    const newsLine = renderNewsLine(p);
    if(newsLine) nameCol.appendChild(newsLine);
    row.appendChild(nameCol);

    row.appendChild(el('div','bye-col', p.bye ? 'Bye '+p.bye : '—'));

    const lvl = needLevel(p.pos);
    const needCol = el('div','need-col');
    needCol.innerHTML = `<span class="need-dot ${needClass(lvl)}" title="${needTooltip(lvl, p.pos)}"></span>`;
    row.appendChild(needCol);

    const actionCol = el('div','action-col');
    if(!drafted){
      const mineBtn = el('button','mini-btn mine-btn','MINE');
      mineBtn.onclick = () => draftPlayer(p.id,'mine');
      const takenBtn = el('button','mini-btn taken-btn','TAKEN');
      takenBtn.onclick = () => draftPlayer(p.id,'other');
      actionCol.appendChild(mineBtn); actionCol.appendChild(takenBtn);
    } else {
      const undoBtn = el('button','mini-btn undo-btn','UNDO');
      undoBtn.onclick = () => undoDraft(p.id);
      actionCol.appendChild(undoBtn);
    }
    row.appendChild(actionCol);

    board.appendChild(row);
  });
}

function renderBoardOnly(){
  const board = document.getElementById('board-body');
  if(board) fillBoard(board);
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';

  if(state.banner){
    const banner = el('div','status-banner show ' + (state.banner.type==='ok'?'ok':'err'));
    banner.appendChild(el('span',null,state.banner.text));
    const closeBtn = el('button',null,'&times;');
    closeBtn.onclick = () => { state.banner = null; render(); };
    banner.appendChild(closeBtn);
    app.appendChild(banner);
  }

  // Empty state: no leagues exist yet (or the active one was deleted) —
  // show the setup screen instead of a board with nothing to draft into.
  if(!activeLeagueId || !leagues[activeLeagueId]){
    if(!state.leagueForm) state.leagueForm = blankLeagueForm(null);
    renderLeagueSetupScreen(app);
    return;
  }

  const header = el('header');
  const brand = el('div','brand');
  brand.innerHTML = `<div class="brand-row"><span class="eyebrow">${leagues[activeLeagueId].name}</span><h1>Draft Room</h1></div>`;
  const activeMeta = ensurePoolMeta(activeLeagueId)[state.posFilter];
  // The ALL pool is the one that actually matters for accuracy (it drives
  // recommendations), so only its "still on default data" state gets the
  // red alert treatment. A position tab with no dedicated upload just falls
  // back gracefully to ALL, filtered — worth knowing, not worth alarming.
  const noCsv = state.posFilter === 'ALL' && (!activeMeta || activeMeta.type === 'default');
  const activeLine = el('div', 'source-line ' + (noCsv ? 'no-csv-alert' : 'active-source'));
  activeLine.innerHTML = `<strong>${state.posFilter}:</strong> ${formatSourceMeta(activeMeta)}`;
  brand.appendChild(activeLine);
  header.appendChild(brand);

  const headerRight = el('div','header-right');

  const pickTracker = el('div','pick-tracker');
  pickTracker.innerHTML = `<div><div class="num">${state.pick}</div><div class="lbl">Pick</div></div>`;
  const stepper = el('div','pick-stepper');
  const down = el('button',null,'&minus;'); down.onclick = () => { state.pick = Math.max(1,state.pick-1); render(); };
  const up = el('button',null,'&plus;'); up.onclick = () => { state.pick += 1; render(); };
  stepper.appendChild(down); stepper.appendChild(up);
  pickTracker.appendChild(stepper);
  headerRight.appendChild(pickTracker);

  const saveIndicator = el('span', 'save-indicator ' + saveStatus,
    saveStatus === 'ok' ? 'Synced'
    : saveStatus === 'saving' ? 'Saving…'
    : `Not saved — retrying (${saveRetryCount}/${MAX_SAVE_RETRIES})`);
  saveIndicator.id = 'save-indicator';
  saveIndicator.title = 'Cloud autosave status — this is separate from Claude usage; it never calls the Claude API.';
  headerRight.appendChild(saveIndicator);

  const uploadBtn = el('button','upload-btn', `Update ${state.posFilter === 'ALL' ? '' : state.posFilter + ' '}tier list (CSV/XLSX)`);
  uploadBtn.title = state.posFilter === 'ALL'
    ? 'Uploads the overall cross-position list that recommendations are based on.'
    : `Uploads a dedicated ${state.posFilter}-only tier list for this tab. Recommendations still use the ALL list.`;
  uploadBtn.onclick = () => { uploadTargetPool = state.posFilter; document.getElementById('csv-input').click(); };
  headerRight.appendChild(uploadBtn);

  const downloadBtn = el('button','upload-btn','Download backup (JSON)');
  downloadBtn.onclick = () => exportBackup();
  headerRight.appendChild(downloadBtn);

  const restoreBtn = el('button','upload-btn','Restore backup');
  restoreBtn.onclick = () => document.getElementById('backup-input').click();
  headerRight.appendChild(restoreBtn);

  const resetBtn = el('button','reset-btn','Reset draft');
  resetBtn.onclick = () => { showConfirm(`Reset the whole ${leagues[activeLeagueId].name} draft? This will permanently delete your saved picks, roster, and pick counter for this league — it can't be undone. Your player notes (Avoid/Sleeper/Note) will be kept.`, resetAll); };
  headerRight.appendChild(resetBtn);

  const resetNotesBtn = el('button','reset-btn','Reset notes');
  resetNotesBtn.onclick = () => { showConfirm(`Clear every note, Avoid, and Sleeper flag for ${leagues[activeLeagueId].name}? This will permanently delete them — it can't be undone. Your draft progress will not be affected.`, resetNotes); };
  headerRight.appendChild(resetNotesBtn);

  header.appendChild(headerRight);
  app.appendChild(header);

  const layout = el('div','layout');
  const colLeft = el('div','col-left');
  renderClockCard(colLeft);
  renderRosterCard(colLeft);
  renderLeagueCard(colLeft);
  layout.appendChild(colLeft);

  const colRight = el('div','col-right');
  renderFilterBar(colRight);
  renderBoard(colRight);
  layout.appendChild(colRight);

  app.appendChild(layout);

  const foot = el('footer', null, `${activePlayers().length} players loaded &middot; need-weighted recommendations update instantly on every pick or upload &middot; auto-saves after every action`);
  app.appendChild(foot);

  renderTagModal(app);
  renderConfirmModal(app);
  renderLeagueFormModal(app);
}

function renderLeagueFormFields(f){
  const wrap = el('div','league-form-fields');

  // Name
  const nameField = el('div','modal-field');
  nameField.appendChild(el('label',null,'League Name'));
  const nameInput = el('input','api-key-input');
